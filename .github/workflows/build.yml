name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Check project
        run: |
          echo "Project files:"
          find . -maxdepth 4 -type f | sort

      - name: Build APK
        run: |
          gradle :app:assembleDebug --stacktrace --info

      - name: Find APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GitHubBrowser-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
